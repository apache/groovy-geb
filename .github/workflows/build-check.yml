name: Build, test, and quality check

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21] # TODO add 11
    runs-on: ubuntu-latest
    env:
      DEVELOCITY_ACCESS_KEY: ${{ secrets.DEVELOCITY_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: ${{ matrix.java }}
          check-latest: true
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic
      - name: Check firefox version
        run: /usr/bin/firefox --version
      - name: Install Playwright Chromium
        run: ./gradlew -Pci --no-daemon :module:geb-direct:installPlaywrightBrowsers
      - name: Build and run tests
        run: ./gradlew -Pci --no-daemon --no-build-cache check -x rat # rat in separate workflow for fast feedback
        timeout-minutes: 60
      - name: Upload reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: build-reports-${{ matrix.java }}
          path: '**/build/reports/'
